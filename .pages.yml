media:
  input: src/assets/images
  # Path written into content files. Content lives in src/content/<collection>/,
  # so images are referenced relative to it (Astro needs this to find and optimise them).
  output: ../../assets/images
  rename: false
  categories: [image]

content:
  - name: home-en
    label: Home page (English)
    type: file
    path: src/content/home/en.md
    format: yaml-frontmatter
    fields:
      - { name: title, label: "Google title (shown after the church name, keep under ~60 characters)", type: string, required: true }
      - { name: description, label: "Google description (keep under ~160 characters)", type: text, required: true }
      - { name: heroTitle, label: Banner heading, type: string, required: true }
      - { name: heroText, label: Banner text, type: text, required: true }
      - { name: heroImage, label: Banner photo, type: image, required: true }
      - { name: heroImageAlt, label: Banner photo description (for screen readers), type: string, required: true }
      - { name: heroPrimaryButton, label: Banner button 1 (goes to Visit page), type: string, required: true }
      - { name: heroSecondaryButton, label: Banner button 2 (goes to About page), type: string, required: true }
      - { name: quote, label: Quote (leave empty to hide), type: text }
      - { name: quoteSource, label: Quote source, type: string }
      - { name: serviceTimesTitle, label: Service times heading, type: string, required: true }
      - { name: serviceTimes, label: Service times, type: string, required: true }
      - { name: serviceTimesPlaceholder, label: Show "example" badge on service times, type: boolean }
      - { name: serviceTimesLink, label: Service times link text (leave empty to hide), type: string }
      - { name: locationTitle, label: Location heading, type: string, required: true }
      - { name: locationLink, label: Location link text (leave empty to hide), type: string }
      - { name: beliefsTitle, label: Beliefs heading, type: string, required: true }
      - { name: beliefsText, label: Beliefs text, type: string }
      - { name: beliefsLink, label: Beliefs link text, type: string, required: true }
      - { name: ministriesTitle, label: Ministries heading, type: string, required: true }
      - { name: ministriesText, label: Ministries intro text, type: text }
      - { name: visitTitle, label: Visit section heading, type: string, required: true }
      - { name: visitText, label: Visit section text, type: text, required: true }
      - { name: visitButton, label: Visit section button, type: string, required: true }
      - { name: visitImage, label: Visit section photo, type: image, required: true }
      - { name: visitImageAlt, label: Visit section photo description (for screen readers), type: string, required: true }

  - name: home-ne
    label: Home page (Nepali)
    type: file
    path: src/content/home/ne.md
    format: yaml-frontmatter
    fields:
      - { name: title, label: "Google title (shown after the church name, keep under ~60 characters)", type: string, required: true }
      - { name: description, label: "Google description (keep under ~160 characters)", type: text, required: true }
      - { name: heroTitle, label: Banner heading, type: string, required: true }
      - { name: heroText, label: Banner text, type: text, required: true }
      - { name: heroImage, label: Banner photo, type: image, required: true }
      - { name: heroImageAlt, label: Banner photo description (for screen readers), type: string, required: true }
      - { name: heroPrimaryButton, label: Banner button 1 (goes to Visit page), type: string, required: true }
      - { name: heroSecondaryButton, label: Banner button 2 (goes to About page), type: string, required: true }
      - { name: quote, label: Quote (leave empty to hide), type: text }
      - { name: quoteSource, label: Quote source, type: string }
      - { name: serviceTimesTitle, label: Service times heading, type: string, required: true }
      - { name: serviceTimes, label: Service times, type: string, required: true }
      - { name: serviceTimesPlaceholder, label: Show "example" badge on service times, type: boolean }
      - { name: serviceTimesLink, label: Service times link text (leave empty to hide), type: string }
      - { name: locationTitle, label: Location heading, type: string, required: true }
      - { name: locationLink, label: Location link text (leave empty to hide), type: string }
      - { name: beliefsTitle, label: Beliefs heading, type: string, required: true }
      - { name: beliefsText, label: Beliefs text, type: string }
      - { name: beliefsLink, label: Beliefs link text, type: string, required: true }
      - { name: ministriesTitle, label: Ministries heading, type: string, required: true }
      - { name: ministriesText, label: Ministries intro text, type: text }
      - { name: visitTitle, label: Visit section heading, type: string, required: true }
      - { name: visitText, label: Visit section text, type: text, required: true }
      - { name: visitButton, label: Visit section button, type: string, required: true }
      - { name: visitImage, label: Visit section photo, type: image, required: true }
      - { name: visitImageAlt, label: Visit section photo description (for screen readers), type: string, required: true }

  - name: ministries
    label: Ministries
    type: collection
    path: src/content/ministries
    format: yaml-frontmatter
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: summary
        label: Summary
        type: text
        required: true
      - name: meetingTime
        label: Meeting time
        type: string
      - name: leader
        label: Leader
        type: string
      - name: placeholder
        label: Placeholder content
        type: boolean
      - name: order
        label: Display order
        type: number
        required: true
      - name: image
        label: Photo
        type: image
        required: true
      - name: body
        label: Additional content
        type: rich-text
        options:
          format: markdown
          media: false

  - name: sermons
    label: Sermons
    type: collection
    path: src/content/sermons
    format: yaml-frontmatter
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: youtubeUrl
        label: YouTube URL
        type: string
      - name: body
        label: Notes
        type: rich-text
        options:
          format: markdown
          media: false
    view:
      primary: title
      sort: date
      order: desc

  - name: faith
    label: Statements of Faith
    type: collection
    path: src/content/faith
    format: yaml-frontmatter
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: locale
        label: Language
        type: select
        required: true
        options:
          values:
            - name: en
              label: English
            - name: ne
              label: Nepali
      - name: translationPending
        label: Translation pending
        type: boolean
      - name: body
        label: Content
        type: rich-text
        required: true
        options:
          format: markdown
          media: false
    view:
      primary: title
      sort: locale

  - name: covenant
    label: Church Covenant
    type: collection
    path: src/content/covenant
    format: yaml-frontmatter
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: locale
        label: Language
        type: select
        required: true
        options:
          values:
            - name: en
              label: English
            - name: ne
              label: Nepali
      - name: translationPending
        label: Translation pending
        type: boolean
      - name: body
        label: Content
        type: rich-text
        required: true
        options:
          format: markdown
          media: false
    view:
      primary: title
      sort: locale
